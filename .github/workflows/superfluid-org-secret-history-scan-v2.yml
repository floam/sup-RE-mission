name: Scan Superfluid org history for current-service secrets v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/superfluid-org-secret-history-scan-v2.yml

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: list
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t names < <(gh api --paginate 'orgs/superfluid-org/repos?type=public&per_page=100' --jq '.[].full_name' | sort -u)
          json="$(printf '%s\n' "${names[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "repos=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#names[@]}" >> "$GITHUB_OUTPUT"

  scan:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.enumerate.outputs.repos) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Mirror repository and GitHub-exposed refs
        id: clone
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -Eeuo pipefail
          name="${REPO#*/}"
          default_branch="$(gh api "repos/${REPO}" --jq .default_branch)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

          git clone --mirror "https://github.com/${REPO}.git" repo.git
          git -C repo.git fetch origin \
            '+refs/pull/*/head:refs/pull/*/head' \
            '+refs/pull/*/merge:refs/pull/*/merge' \
            '+refs/notes/*:refs/notes/*' \
            --force || true
          git -C repo.git fsck --full --no-reflogs > fsck.txt 2>&1 || true
          git -C repo.git worktree add --detach tip "refs/heads/${default_branch}"

      - name: Write current-service scan rules
        shell: bash
        run: |
          cat > gitleaks.toml <<'TOML'
          [extend]
          useDefault = true

          [[rules]]
          id = "superfluid-platform-api-key"
          description = "Superfluid Platform API key"
          regex = '''\bsfp_[0-9A-Za-z_-]{32,}\b'''
          keywords = ["sfp_"]

          [[rules]]
          id = "trigger-dev-key"
          description = "Trigger.dev key"
          regex = '''\btr_(?:dev|prod|pat|test)_[A-Za-z0-9_-]{20,}\b'''
          keywords = ["tr_dev_", "tr_prod_", "tr_pat_", "tr_test_"]

          [[rules]]
          id = "vercel-blob-token"
          description = "Vercel Blob token"
          regex = '''\bvercel_blob_(?:rw|ro)_[A-Za-z0-9_=-]{20,}\b'''
          keywords = ["vercel_blob_"]

          [[rules]]
          id = "alchemy-rpc-key"
          description = "Alchemy RPC credential"
          regex = '''https://[A-Za-z0-9.-]*g\.alchemy\.com/v2/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["alchemy.com"]

          [[rules]]
          id = "infura-rpc-key"
          description = "Infura RPC credential"
          regex = '''https://[A-Za-z0-9.-]*infura\.io/v3/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["infura.io"]

          [[rules]]
          id = "quicknode-rpc-key"
          description = "QuickNode RPC credential"
          regex = '''https://[A-Za-z0-9.-]+\.quiknode\.pro/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["quiknode.pro"]

          [[rules]]
          id = "cms-payload-secret-assignment"
          description = "CMS Payload secret assignment"
          regex = '''(?i)PAYLOAD_SECRET\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["PAYLOAD_SECRET"]

          [[rules]]
          id = "trigger-secret-assignment"
          description = "Trigger.dev secret assignment"
          regex = '''(?i)TRIGGER_(?:SECRET_KEY|ACCESS_TOKEN|PROJECT_REF)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["TRIGGER_"]

          [[rules]]
          id = "vercel-secret-assignment"
          description = "Vercel or Blob secret assignment"
          regex = '''(?i)(?:BLOB_READ_WRITE_TOKEN|SUPERFLUID_DATA_BLOB_READ_WRITE_TOKEN|VERCEL_TOKEN|VERCEL_ACCESS_TOKEN|VERCEL_PROTECTION_BYPASS)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["VERCEL_", "BLOB_READ_WRITE_TOKEN"]

          [[rules]]
          id = "database-secret-assignment"
          description = "Database/Neon/Postgres credential assignment"
          regex = '''(?i)(?:DATABASE_URL|DATABASE_URI|POSTGRES_URL|POSTGRES_PRISMA_URL|POSTGRES_URL_NON_POOLING|NEON_DATABASE_URL)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["DATABASE_", "POSTGRES_", "NEON_"]

          [[rules]]
          id = "redis-secret-assignment"
          description = "Redis/Upstash credential assignment"
          regex = '''(?i)(?:REDIS_URL|REDIS_TOKEN|REDIS_PASSWORD|UPSTASH_REDIS_REST_TOKEN|UPSTASH_REDIS_REST_URL)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["REDIS_", "UPSTASH_"]

          [[rules]]
          id = "email-secret-assignment"
          description = "Email SaaS credential assignment"
          regex = '''(?i)(?:SMTP_PASS|SMTP_PASSWORD|SENDGRID_API_KEY|MAILGUN_API_KEY|POSTMARK_SERVER_TOKEN|RESEND_API_KEY)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["SMTP_", "SENDGRID_", "MAILGUN_", "POSTMARK_", "RESEND_"]

          [[rules]]
          id = "signer-private-key-assignment"
          description = "Signer, relayer, deployment, or keystore secret assignment"
          regex = '''(?i)(?:SIGNER_PRIVATE_KEY|RELAYER_SIGNER_PRIVATE_KEY|DEPLOYER_PRIVATE_KEY|PRIVATE_KEY|MNEMONIC|OZ_RELAYER_API_KEY|SAFE_API_KEY|OZ_STORAGE_ENCRYPTION_KEY|KEYSTORE_PASSWORD|KEYSTORE_PASSPHRASE)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["PRIVATE_KEY", "MNEMONIC", "RELAYER_", "KEYSTORE_", "SAFE_API_KEY"]

          [[rules]]
          id = "rpc-indexer-secret-assignment"
          description = "RPC, indexer, or market-data credential assignment"
          regex = '''(?i)(?:ALCHEMY_API_KEY|INFURA_API_KEY|QUICKNODE_API_KEY|GOLDSKY_API_KEY|THE_GRAPH_API_KEY|COINGECKO_API_KEY)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["ALCHEMY_", "INFURA_", "QUICKNODE_", "GOLDSKY_", "THE_GRAPH_", "COINGECKO_"]

          [[rules]]
          id = "cloud-ci-secret-assignment"
          description = "Cloud, CI, registry, or monitoring credential assignment"
          regex = '''(?i)(?:AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|CLOUDFLARE_API_TOKEN|NPM_TOKEN|GITHUB_TOKEN|SENTRY_AUTH_TOKEN)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["AWS_", "CLOUDFLARE_", "NPM_TOKEN", "GITHUB_TOKEN", "SENTRY_"]

          [[rules]]
          id = "internal-saas-secret-assignment"
          description = "Windmill or observability credential assignment"
          regex = '''(?i)(?:WINDMILL_TOKEN|GRAFANA_TOKEN|LOKI_TOKEN|TEMPO_TOKEN|PROMETHEUS_TOKEN|ALERTMANAGER_TOKEN)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["WINDMILL_", "GRAFANA_", "LOKI_", "TEMPO_", "PROMETHEUS_", "ALERTMANAGER_"]
          TOML

      - name: Scan reachable history and current default tip
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          gitleaks git repo.git \
            --config gitleaks.toml \
            --report-format json \
            --report-path reports/history.raw.json \
            --redact=100 \
            --exit-code 0 \
            --log-level error \
            --no-banner

          gitleaks dir tip \
            --config gitleaks.toml \
            --report-format json \
            --report-path reports/default-tip.raw.json \
            --redact=100 \
            --exit-code 0 \
            --log-level error \
            --no-banner

      - name: Produce irreversibly redacted repository report
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          DEFAULT_BRANCH: ${{ steps.clone.outputs.default_branch }}
          NAME: ${{ steps.clone.outputs.name }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import Counter
          from pathlib import Path

          repo = os.environ['REPO']
          name = os.environ['NAME']
          default_branch = os.environ['DEFAULT_BRANCH']

          def load(path):
              p = Path(path)
              if not p.exists() or not p.read_text().strip():
                  return []
              return json.loads(p.read_text())

          def service(rule):
              r = rule.lower()
              mapping = [
                  (('payload',), 'CMS/Payload'),
                  (('trigger',), 'Trigger.dev'),
                  (('vercel', 'blob-token'), 'Vercel/Blob'),
                  (('database', 'postgres', 'neon'), 'Database/Neon/Postgres'),
                  (('redis', 'upstash'), 'Redis/Upstash'),
                  (('email-', 'sendgrid', 'mailgun', 'postmark', 'resend', 'smtp'), 'Email SaaS'),
                  (('signer', 'private-key', 'private_key', 'mnemonic', 'keystore', 'relayer'), 'Signer/relayer/private key'),
                  (('alchemy',), 'Alchemy RPC'),
                  (('infura',), 'Infura RPC'),
                  (('quicknode',), 'QuickNode RPC'),
                  (('goldsky', 'the-graph', 'coingecko', 'rpc-indexer'), 'RPC/indexer/market-data SaaS'),
                  (('sentry',), 'Sentry'),
                  (('slack',), 'Slack'),
                  (('github',), 'GitHub'),
                  (('npm',), 'npm registry'),
                  (('aws',), 'AWS'),
                  (('cloudflare',), 'Cloudflare'),
                  (('stripe',), 'Stripe'),
                  (('windmill', 'grafana', 'loki', 'tempo', 'prometheus', 'alertmanager', 'internal-saas'), 'Internal SaaS/observability'),
                  (('superfluid-platform',), 'Superfluid Platform API'),
                  (('cloud-ci',), 'Cloud/CI/registry'),
              ]
              for needles, label in mapping:
                  if any(n in r for n in needles):
                      return label
              return 'Other high-confidence detector'

          ancestry_cache = {}
          refs_cache = {}
          def on_default(commit):
              if not commit:
                  return None
              if commit not in ancestry_cache:
                  ancestry_cache[commit] = subprocess.run(
                      ['git', '-C', 'repo.git', 'merge-base', '--is-ancestor', commit, f'refs/heads/{default_branch}'],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  ).returncode == 0
              return ancestry_cache[commit]

          def containing_refs(commit):
              if not commit:
                  return []
              if commit not in refs_cache:
                  p = subprocess.run(
                      ['git', '-C', 'repo.git', 'for-each-ref', '--contains', commit,
                       '--format=%(refname)', 'refs/heads', 'refs/tags', 'refs/pull'],
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
                  )
                  refs_cache[commit] = p.stdout.splitlines()[:100] if p.returncode == 0 else []
              return refs_cache[commit]

          def sanitize(rows, scope):
              out = []
              for row in rows:
                  rule = str(row.get('RuleID', ''))
                  file = str(row.get('File', ''))
                  commit = str(row.get('Commit', ''))
                  item = {
                      'scope': scope,
                      'repository': repo,
                      'default_branch': default_branch,
                      'rule_id': rule,
                      'description': row.get('Description'),
                      'service': service(rule),
                      'file': file,
                      'start_line': row.get('StartLine'),
                      'end_line': row.get('EndLine'),
                      'commit': commit or None,
                      'commit_date': row.get('Date'),
                      'entropy': row.get('Entropy'),
                      'on_default_branch_history': on_default(commit) if scope == 'history' else True,
                      'legacy_eligibility_repository': repo == 'superfluid-org/sup-eligibility-api',
                  }
                  if scope == 'history':
                      item['reachable_from_refs'] = containing_refs(commit)
                  out.append(item)
              return out

          history = sanitize(load('reports/history.raw.json'), 'history')
          current = sanitize(load('reports/default-tip.raw.json'), 'default-tip')
          fsck_text = Path('fsck.txt').read_text(errors='replace') if Path('fsck.txt').exists() else ''
          unreachable = [x for x in fsck_text.splitlines() if re.search(r'\b(?:dangling|unreachable)\b', x)]

          report = {
              'repository': repo,
              'default_branch': default_branch,
              'history_findings': history,
              'default_tip_findings': current,
              'history_counts_by_service': dict(Counter(x['service'] for x in history)),
              'default_tip_counts_by_service': dict(Counter(x['service'] for x in current)),
              'fsck_dangling_or_unreachable_lines': unreachable[:100],
              'redaction': 'Gitleaks applied 100% redaction. Secret, Match, and line-content fields were then omitted entirely.',
          }
          Path(f'{name}.safe.json').write_text(json.dumps(report, indent=2))
          PY
          rm -f reports/*.raw.json

      - name: Upload redacted repository report
        uses: actions/upload-artifact@v4
        with:
          name: sf-current-service-secret-scan-${{ steps.clone.outputs.name }}
          path: ${{ steps.clone.outputs.name }}.safe.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

  aggregate:
    needs: [enumerate, scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download redacted reports
        uses: actions/download-artifact@v4
        with:
          pattern: sf-current-service-secret-scan-*
          path: reports
          merge-multiple: true

      - name: Aggregate results
        shell: bash
        env:
          EXPECTED: ${{ needs.enumerate.outputs.count }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path

          reports = [json.loads(p.read_text()) for p in sorted(Path('reports').glob('*.safe.json'))]
          history = [x for r in reports for x in r['history_findings']]
          current = [x for r in reports for x in r['default_tip_findings']]
          fsck = {r['repository']: r['fsck_dangling_or_unreachable_lines'] for r in reports if r['fsck_dangling_or_unreachable_lines']}
          result = {
              'repositories_expected': int(os.environ.get('EXPECTED') or 0),
              'repositories_reported': len(reports),
              'history_finding_count': len(history),
              'default_tip_finding_count': len(current),
              'history_counts_by_service': dict(Counter(x['service'] for x in history)),
              'default_tip_counts_by_service': dict(Counter(x['service'] for x in current)),
              'history_counts_by_repository': dict(Counter(x['repository'] for x in history)),
              'default_tip_counts_by_repository': dict(Counter(x['repository'] for x in current)),
              'history_counts_by_rule': dict(Counter(x['rule_id'] for x in history)),
              'default_tip_counts_by_rule': dict(Counter(x['rule_id'] for x in current)),
              'fsck_dangling_or_unreachable': fsck,
              'history_findings': history,
              'default_tip_findings': current,
              'method': {
                  'scanner': 'Verified Gitleaks 8.30.1 default rules plus current Superfluid service rules',
                  'history_scope': 'All commits reachable from mirrored branches, tags, GitHub PR head/merge refs, and notes',
                  'current_scope': 'Separate scan of every default-branch tip',
                  'redaction': '100% scanner redaction followed by omission of secret, match, and line-content fields',
                  'credential_testing': 'None',
              },
          }
          Path('superfluid-org-current-service-secret-history-scan.json').write_text(json.dumps(result, indent=2))
          Path('superfluid-org-current-service-secret-history-scan-summary.txt').write_text(
              f"Repositories: {len(reports)}/{result['repositories_expected']}\n"
              f"History findings: {len(history)}\n"
              f"Default-tip findings: {len(current)}\n"
              f"History by service: {result['history_counts_by_service']}\n"
              f"Current by service: {result['default_tip_counts_by_service']}\n"
          )
          PY

      - name: Upload combined redacted audit
        uses: actions/upload-artifact@v4
        with:
          name: superfluid-org-current-service-secret-history-scan
          path: |
            superfluid-org-current-service-secret-history-scan.json
            superfluid-org-current-service-secret-history-scan-summary.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
