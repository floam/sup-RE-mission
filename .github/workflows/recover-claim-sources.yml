name: Recover claim app sources

on:
  pull_request:
    paths:
      - ".github/workflows/recover-claim-sources.yml"
      - "tools/claim-source-recovery/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Capture and reconstruct deployed sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Recover live sources
        id: recover
        shell: bash
        run: |
          set +e
          mkdir -p recovered/claim.superfluid.org
          npm run recover:claim-sources -- --out recovered/claim.superfluid.org 2>&1 | tee recovered/claim.superfluid.org/recovery.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record recovery summary
        if: always()
        shell: bash
        run: |
          if [[ -f recovered/claim.superfluid.org/manifest.json ]]; then
            node -e 'const m=require("./recovered/claim.superfluid.org/manifest.json"); console.log(`## Claim source recovery\n\n- Routes captured: ${m.summary.successfulRoutes}/${m.summary.attemptedRoutes}\n- Failed routes: ${m.summary.failedRoutes}\n- Assets: ${m.summary.successfulAssets}/${m.summary.assets}\n- Published source-map originals: ${m.summary.sourceMappedOriginals}\n- Synthesized webpack modules: ${m.summary.synthesizedModules}\n- Failed assets: ${m.summary.failedAssets}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Claim source recovery\n\nRecovery exited with status %s before producing a manifest. See recovery.log in the artifact.\n' '${{ steps.recover.outputs.exit_status }}' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package recovery
        if: always()
        run: zip -qr claim-superfluid-source-recovery.zip recovered/claim.superfluid.org

      - name: Upload recovered sources and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-superfluid-source-recovery
          path: claim-superfluid-source-recovery.zip
          if-no-files-found: error
          retention-days: 30

      - name: Fail when recovery failed
        if: steps.recover.outputs.exit_status != '0'
        run: exit 1
