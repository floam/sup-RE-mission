name: Compare Superfluid RPC endpoints

on:
  pull_request:
    paths:
      - ".github/workflows/compare-rpc-endpoints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe CORS and bare x behavior
        shell: bash
        run: |
          set -u
          mkdir -p rpc-endpoint-comparison
          payload='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          : > rpc-endpoint-comparison/cors-and-bare.txt

          probe() {
            name="$1"
            url="$2"
            insecure="${3:-false}"
            flags=(-sS --max-time 15)
            if [ "$insecure" = true ]; then flags+=(-k); fi

            {
              echo "===== $name POST with Origin ====="
              curl "${flags[@]}" -D - -o - \
                -H 'origin: https://example.invalid' \
                -H 'content-type: application/json' \
                --data "$payload" "$url" || true
              echo
              echo "===== $name OPTIONS preflight ====="
              curl "${flags[@]}" -D - -o - -X OPTIONS \
                -H 'origin: https://example.invalid' \
                -H 'access-control-request-method: POST' \
                -H 'access-control-request-headers: content-type' \
                "$url" || true
              echo
            } >> rpc-endpoint-comparison/cors-and-bare.txt
          }

          probe 'legacy base-mainnet' 'https://rpc-endpoints.superfluid.dev/base-mainnet'
          probe 'x eth-mainnet' 'https://eth-mainnet.arpc.x.superfluid.dev'
          probe 'x polygon-mainnet' 'https://polygon-mainnet.arpc.x.superfluid.dev'
          probe 'x base-mainnet' 'https://base-mainnet.arpc.x.superfluid.dev'
          probe 'bare rpc-endpoints.x root insecure' 'https://rpc-endpoints.x.superfluid.dev/' true
          probe 'bare rpc-endpoints.x /eth-mainnet insecure' 'https://rpc-endpoints.x.superfluid.dev/eth-mainnet' true

          cat rpc-endpoint-comparison/cors-and-bare.txt

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-endpoint-comparison-cors
          path: rpc-endpoint-comparison
          if-no-files-found: error
          retention-days: 7
