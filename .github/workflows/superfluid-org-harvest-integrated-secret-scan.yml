name: Scan harvested Superfluid history for current-service secrets

on:
  pull_request:
    branches: [main]
    paths:
      - research/history-harvest/RUN-INTEGRATED-*

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  scan-harvested-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      DOWNLOAD: ${{ runner.temp }}/mirror-download
      FLAT: ${{ runner.temp }}/mirror-flat
      EXTRACTED: ${{ runner.temp }}/mirror-extracted
      REPORTS: ${{ runner.temp }}/integrated-reports
    steps:
      - uses: actions/checkout@v4

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Wait for the matching harvested mirror run
        id: mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_name='Build Superfluid org history mirror'
          run_id=''

          for attempt in $(seq 1 720); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100")"

            run_id="$(jq -r --arg name "$workflow_name" '
              [.workflow_runs[]
               | select(.name == $name and .status == "completed" and .conclusion == "success")]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi

            failed="$(jq -r --arg name "$workflow_name" '
              [.workflow_runs[]
               | select(.name == $name and .status == "completed"
                        and (.conclusion == "failure" or .conclusion == "cancelled"
                             or .conclusion == "timed_out" or .conclusion == "action_required"))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$runs")"
            if [ -n "$failed" ]; then
              echo "Matching mirror run failed: $failed" >&2
              exit 1
            fi

            echo "Waiting for harvested mirror for ${HEAD_SHA} (attempt ${attempt}/720)"
            sleep 30
          done

          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using harvested mirror run $run_id"

      - name: Download, verify, and extract harvested mirrors
        shell: bash
        env:
          MIRROR_RUN_ID: ${{ steps.mirror.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$DOWNLOAD" "$FLAT" "$EXTRACTED" "$REPORTS"

          gh run download "$MIRROR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'superfluid-org-history-mirrors-part-*' \
            --dir "$DOWNLOAD/parts"
          gh run download "$MIRROR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name 'superfluid-org-history-mirrors-manifests' \
            --dir "$DOWNLOAD/manifests"
          gh run download "$MIRROR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name 'superfluid-org-reference-harvest' \
            --dir "$DOWNLOAD/reference-harvest"

          find "$DOWNLOAD/parts" -type f \
            -name 'superfluid-org-history-mirrors.tar.zst.part-*' \
            -exec cp '{}' "$FLAT/" ';'
          find "$DOWNLOAD/manifests" -type f -maxdepth 3 -exec cp '{}' "$FLAT/" ';'

          part_count="$(find "$FLAT" -maxdepth 1 \
            -name 'superfluid-org-history-mirrors.tar.zst.part-*' | wc -l | tr -d ' ')"
          expected_count="$(cat "$FLAT/part-count.txt")"
          test "$part_count" = "$expected_count"

          (
            cd "$FLAT"
            sha256sum --check superfluid-org-history-mirrors.parts.sha256
            cat superfluid-org-history-mirrors.tar.zst.part-* \
              > superfluid-org-history-mirrors.tar.zst
            expected="$(awk '{print $1}' superfluid-org-history-mirrors.tar.zst.sha256)"
            echo "$expected  superfluid-org-history-mirrors.tar.zst" | sha256sum --check
          )

          tar --zstd -xf "$FLAT/superfluid-org-history-mirrors.tar.zst" -C "$EXTRACTED"
          test -d "$EXTRACTED/superfluid-org-history/repos"

      - name: Scan all advertised, PR, fork, detached, and recovered candidate refs
        shell: bash
        env:
          MIRROR_RUN_ID: ${{ steps.mirror.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          ROOT="$EXTRACTED/superfluid-org-history"
          SAFE="$REPORTS/repositories"
          mkdir -p "$SAFE"

          while IFS= read -r full_repo; do
            [ -n "$full_repo" ] || continue
            name="${full_repo#*/}"
            bare="$ROOT/repos/${name}.git"
            [ -d "$bare" ] || {
              printf '%s\n' "$full_repo" >> "$REPORTS/missing-mirrors.txt"
              continue
            }

            echo "::group::Scanning $full_repo"
            raw="$RUNNER_TEMP/${name}.gitleaks.raw.json"
            gitleaks git "$bare" \
              --log-opts="--all" \
              --config research/history-harvest/current-service-gitleaks.toml \
              --report-format json \
              --report-path "$raw" \
              --exit-code 0 \
              --log-level error \
              --no-banner

            REPOSITORY="$full_repo" BARE="$bare" RAW="$raw" \
              OUTPUT="$SAFE/${name}.safe.json" ROOT="$ROOT" \
              python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from collections import defaultdict
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          bare = os.environ['BARE']
          raw_path = Path(os.environ['RAW'])
          output = Path(os.environ['OUTPUT'])
          root = Path(os.environ['ROOT'])

          rows = []
          if raw_path.exists() and raw_path.stat().st_size:
              rows = json.loads(raw_path.read_text(errors='replace'))

          default_ref = subprocess.run(
              ['git', '-C', bare, 'symbolic-ref', 'HEAD'],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
          ).stdout.strip()
          default_branch = default_ref.removeprefix('refs/heads/') if default_ref else ''

          candidate_sources = defaultdict(list)
          fetch_results = root / 'meta' / 'candidate-fetch-results.tsv'
          if fetch_results.exists():
              for index, line in enumerate(fetch_results.read_text(errors='replace').splitlines()):
                  if index == 0 or not line.strip():
                      continue
                  parts = line.split('\t')
                  if len(parts) < 5:
                      continue
                  repo, sha, source, result, remote_hint = parts[:5]
                  if repo == repository:
                      candidate_sources[sha].append({
                          'source': source,
                          'result': result,
                          'remote_hint': remote_hint or None,
                      })

          placeholder_terms = (
              'your-', 'your_', 'your ', 'example', 'placeholder', 'changeme',
              'change_me', 'dummy', 'sample', 'redacted', 'replace', 'insert',
              'process.env', 'import.meta.env', '${', '{{', 'secrets.', '<secret',
              '<token', '<key', 'not-production', 'not_production', 'localhost'
          )
          high_value_rules = {
              'superfluid-platform-api-key', 'trigger-dev-key', 'vercel-blob-token',
              'alchemy-rpc-key', 'infura-rpc-key', 'quicknode-rpc-key',
              'credentialed-service-url', 'cms-auth-secret-assignment',
              'trigger-secret-assignment', 'vercel-secret-assignment',
              'database-secret-assignment', 'redis-secret-assignment',
              'email-secret-assignment', 'signer-private-key-assignment',
              'rpc-indexer-secret-assignment', 'cloud-ci-secret-assignment',
              'internal-saas-secret-assignment', 'github-pat', 'github-fine-grained-pat',
              'stripe-access-token', 'slack-webhook-url', 'aws-access-token',
              'private-key', 'jwt'
          }

          def value_shape(secret):
              if re.fullmatch(r'0x[0-9a-fA-F]+', secret):
                  return f'0x-hex/{len(secret)-2}'
              if re.fullmatch(r'[0-9a-fA-F]+', secret):
                  return f'hex/{len(secret)}'
              if re.fullmatch(r'[A-Za-z0-9_-]+', secret):
                  return f'base64url-like/{len(secret)}'
              if '://' in secret:
                  return f'url/{len(secret)}'
              if ' ' in secret:
                  return f'words/{len(secret.split())}'
              return f'mixed/{len(secret)}'

          def file_context(path):
              p = path.lower()
              if any(x in p for x in ('node_modules/', '/vendor/', '/lib/forge-std', '/lib/openzeppelin')):
                  return 'vendored'
              if any(x in p for x in ('test', 'fixture', 'mock', 'example', 'sample', 'demo', 'hardhat', 'anvil', 'foundry')):
                  return 'test/example'
              if any(x in p for x in ('readme', 'docs/', 'documentation')):
                  return 'documentation'
              if any(x in p for x in ('.github/workflows', 'docker-compose', 'compose.', 'k8s/', 'helm/', 'terraform', 'vercel.json')):
                  return 'deployment/config'
              if '.env' in p or p.endswith(('.yaml', '.yml', '.toml', '.ini', '.conf', '.json')):
                  return 'configuration'
              return 'source'

          def service(rule):
              r = rule.lower()
              groups = [
                  (('payload', 'cms-auth'), 'CMS/Payload/Auth'),
                  (('trigger',), 'Trigger.dev'),
                  (('vercel', 'blob-token'), 'Vercel/Blob'),
                  (('database', 'postgres', 'neon', 'credentialed-service-url'), 'Database/credentialed service'),
                  (('redis', 'upstash'), 'Redis/Upstash'),
                  (('email-', 'sendgrid', 'mailgun', 'postmark', 'resend', 'smtp'), 'Email SaaS'),
                  (('signer', 'private-key', 'private_key', 'mnemonic', 'keystore', 'relayer'), 'Signer/relayer/private key'),
                  (('alchemy',), 'Alchemy RPC'),
                  (('infura',), 'Infura RPC'),
                  (('quicknode',), 'QuickNode RPC'),
                  (('rpc-indexer', 'goldsky', 'the-graph', 'coingecko'), 'Indexer/market-data SaaS'),
                  (('github',), 'GitHub'),
                  (('npm',), 'npm registry'),
                  (('aws',), 'AWS'),
                  (('cloudflare',), 'Cloudflare'),
                  (('sentry',), 'Sentry'),
                  (('stripe',), 'Stripe'),
                  (('windmill', 'grafana', 'loki', 'tempo', 'prometheus', 'alertmanager', 'internal-saas'), 'Internal SaaS/observability'),
                  (('superfluid-platform',), 'Superfluid Platform API'),
              ]
              for needles, label in groups:
                  if any(needle in r for needle in needles):
                      return label
              return 'Other detector'

          ancestor_cache = {}
          refs_cache = {}

          def on_default(commit):
              if not commit or not default_branch:
                  return None
              if commit not in ancestor_cache:
                  ancestor_cache[commit] = subprocess.run(
                      ['git', '-C', bare, 'merge-base', '--is-ancestor', commit, f'refs/heads/{default_branch}'],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  ).returncode == 0
              return ancestor_cache[commit]

          def containing_refs(commit, rule):
              if not commit or rule not in high_value_rules:
                  return []
              key = (commit, rule)
              if key not in refs_cache:
                  proc = subprocess.run([
                      'git', '-C', bare, 'for-each-ref', '--contains', commit,
                      '--format=%(refname)', 'refs/heads', 'refs/tags', 'refs/pull',
                      'refs/notes', 'refs/recovered'
                  ], text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  refs_cache[key] = proc.stdout.splitlines()[:250] if proc.returncode == 0 else []
              return refs_cache[key]

          findings = []
          for row in rows:
              secret = str(row.get('Secret') or row.get('Match') or '')
              rule = str(row.get('RuleID') or '')
              commit = str(row.get('Commit') or '')
              path = str(row.get('File') or '')
              refs = containing_refs(commit, rule)
              default_history = on_default(commit)
              recovered_refs = [r for r in refs if r.startswith('refs/recovered/')]
              if recovered_refs:
                  scope = 'recovered-reference'
              elif default_history:
                  scope = 'default-branch-history'
              elif any(r.startswith('refs/pull/') for r in refs):
                  scope = 'pull-request-reference'
              elif refs:
                  scope = 'other-branch-or-tag'
              else:
                  scope = 'unclassified-reachable-history'

              lowered = secret.lower()
              obvious_placeholder = (
                  any(term in lowered for term in placeholder_terms)
                  or bool(re.fullmatch(r'(?:x+|0+|1+|a+|f+)', lowered))
              )
              findings.append({
                  'repository': repository,
                  'default_branch': default_branch or None,
                  'rule_id': rule,
                  'description': row.get('Description'),
                  'service': service(rule),
                  'file': path,
                  'start_line': row.get('StartLine'),
                  'end_line': row.get('EndLine'),
                  'commit': commit or None,
                  'commit_date': row.get('Date'),
                  'author': row.get('Author'),
                  'email': row.get('Email'),
                  'entropy': row.get('Entropy'),
                  'value_fingerprint_sha256_16': hashlib.sha256(secret.encode()).hexdigest()[:16] if secret else None,
                  'value_length': len(secret),
                  'value_shape': value_shape(secret),
                  'obvious_placeholder': obvious_placeholder,
                  'file_context': file_context(path),
                  'scope': scope,
                  'on_default_branch_history': default_history,
                  'containing_refs': refs,
                  'recovered_refs': recovered_refs,
                  'harvest_sources': candidate_sources.get(commit, []),
                  'refs_lookup_skipped': rule not in high_value_rules,
              })

          output.write_text(json.dumps({
              'repository': repository,
              'default_branch': default_branch or None,
              'finding_count': len(findings),
              'findings': findings,
              'redaction': 'Raw values were replaced by short SHA-256 fingerprints, lengths, and shapes. Secret, Match, and line-content fields are absent.',
          }, indent=2))
          PY

            rm -f "$raw"
            echo "::endgroup::"
          done < "$ROOT/meta/repositories.txt"

      - name: Aggregate integrated findings and recovery coverage
        shell: bash
        env:
          MIRROR_RUN_ID: ${{ steps.mirror.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          ROOT="$EXTRACTED/superfluid-org-history"
          python3 - <<'PY'
          import csv, json, os
          from collections import Counter
          from pathlib import Path

          reports_dir = Path(os.environ['REPORTS'])
          root = Path(os.environ['EXTRACTED']) / 'superfluid-org-history'
          repository_reports = []
          findings = []
          for path in sorted((reports_dir / 'repositories').glob('*.safe.json')):
              report = json.loads(path.read_text())
              repository_reports.append({
                  'repository': report['repository'],
                  'default_branch': report['default_branch'],
                  'finding_count': report['finding_count'],
              })
              findings.extend(report['findings'])

          def tsv_counts(path, column):
              counts = Counter()
              p = Path(path)
              if not p.exists():
                  return counts
              with p.open(newline='', errors='replace') as handle:
                  reader = csv.DictReader(handle, delimiter='\t')
                  for row in reader:
                      counts[row.get(column) or ''] += 1
              return counts

          candidate_results = tsv_counts(root / 'meta' / 'candidate-fetch-results.tsv', 'result')
          fork_results = tsv_counts(root / 'meta' / 'fork-fetch-results.tsv', 'result')
          scope_counts = Counter(x['scope'] for x in findings)
          recovered = [x for x in findings if x['scope'] == 'recovered-reference']
          high_priority_services = {
              'CMS/Payload/Auth', 'Trigger.dev', 'Vercel/Blob',
              'Database/credentialed service', 'Redis/Upstash', 'Email SaaS',
              'Signer/relayer/private key', 'GitHub', 'AWS', 'Cloudflare',
              'Sentry', 'Internal SaaS/observability', 'Superfluid Platform API'
          }
          high_priority = [
              x for x in findings
              if x['service'] in high_priority_services and not x['obvious_placeholder']
          ]

          aggregate = {
              'generated_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'source_mirror_workflow_run_id': int(os.environ['MIRROR_RUN_ID']),
              'repositories_reported': len(repository_reports),
              'repository_reports': repository_reports,
              'finding_count': len(findings),
              'counts_by_rule': dict(Counter(x['rule_id'] for x in findings)),
              'counts_by_service': dict(Counter(x['service'] for x in findings)),
              'counts_by_repository': dict(Counter(x['repository'] for x in findings)),
              'counts_by_scope': dict(scope_counts),
              'candidate_fetch_results': dict(candidate_results),
              'fork_fetch_results': dict(fork_results),
              'recovered_reference_finding_count': len(recovered),
              'high_priority_nonplaceholder_count': len(high_priority),
              'high_priority_nonplaceholder_findings': high_priority,
              'recovered_reference_findings': recovered,
              'all_findings': findings,
              'method': {
                  'harvest': 'GitHub metadata, recursive surviving forks, detached PR repositories, deployments, Actions runs, comments, releases, recent events, and capped Software Heritage snapshots.',
                  'recovery': 'Mirrored org refs plus fork/detached refs and addressed SHA fetches stored under refs/recovered.',
                  'scan': 'Verified Gitleaks 8.30.1 default rules plus current-service rules, with --log-opts=--all after recovery.',
                  'credential_testing': 'None.',
                  'redaction': 'No raw credential value is retained in this artifact.',
              },
          }
          (reports_dir / 'superfluid-org-harvest-integrated-secret-scan.json').write_text(json.dumps(aggregate, indent=2))
          (reports_dir / 'summary.txt').write_text(
              f"Repositories: {len(repository_reports)}\n"
              f"Findings: {len(findings)}\n"
              f"Recovered-reference findings: {len(recovered)}\n"
              f"High-priority non-placeholder candidates: {len(high_priority)}\n"
              f"Candidate fetch results: {dict(candidate_results)}\n"
              f"Fork fetch results: {dict(fork_results)}\n"
              f"Counts by service: {dict(Counter(x['service'] for x in findings))}\n"
          )

          safe_meta = reports_dir / 'harvest-meta'
          safe_meta.mkdir(exist_ok=True)
          for relative in (
              'meta/candidate-fetch-results.tsv',
              'meta/fork-fetch-results.tsv',
              'meta/repository-counts.tsv',
              'meta/github/api-stats.json',
              'meta/swh/stats.json',
              'meta/github/forks.tsv',
              'meta/candidates.tsv',
          ):
              source = root / relative
              if source.exists():
                  target = safe_meta / source.name
                  target.write_bytes(source.read_bytes())
          PY

      - name: Upload integrated harvested-history scan
        uses: actions/upload-artifact@v4
        with:
          name: superfluid-org-harvest-integrated-secret-scan
          path: |
            ${{ env.REPORTS }}/superfluid-org-harvest-integrated-secret-scan.json
            ${{ env.REPORTS }}/summary.txt
            ${{ env.REPORTS }}/repositories/*.safe.json
            ${{ env.REPORTS }}/harvest-meta/**
            ${{ env.REPORTS }}/missing-mirrors.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
