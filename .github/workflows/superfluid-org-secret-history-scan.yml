name: Scan Superfluid org history for current-service secrets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/superfluid-org-secret-history-scan.yml

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: repos
        shell: bash
        run: |
          set -Eeuo pipefail
          repos="$(gh api --paginate 'orgs/superfluid-org/repos?type=public&per_page=100' \
            --jq '[.[].full_name] | sort | @json' | tail -n 1)"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  scan:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.enumerate.outputs.repos) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Mirror repository and exposed refs
        id: clone
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -Eeuo pipefail
          name="${REPO#*/}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          default_branch="$(gh api "repos/${REPO}" --jq .default_branch)"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

          git clone --mirror "https://github.com/${REPO}.git" repo.git
          git -C repo.git fetch origin \
            '+refs/pull/*/head:refs/pull/*/head' \
            '+refs/pull/*/merge:refs/pull/*/merge' \
            '+refs/notes/*:refs/notes/*' \
            --force || true

          git -C repo.git fsck --full --no-reflogs > fsck.txt 2>&1 || true
          git -C repo.git worktree add --detach tip "refs/heads/${default_branch}"

      - name: Write provider-aware scan configuration
        shell: bash
        run: |
          cat > gitleaks.toml <<'TOML'
          [extend]
          useDefault = true

          [[rules]]
          id = "superfluid-platform-api-key"
          description = "Superfluid Platform API key"
          regex = '''\bsfp_[0-9a-fA-F]{64}\b'''
          keywords = ["sfp_"]

          [[rules]]
          id = "trigger-dev-secret-key"
          description = "Trigger.dev secret or personal-access key"
          regex = '''\btr_(?:dev|prod|pat|test)_[A-Za-z0-9_-]{20,}\b'''
          keywords = ["tr_"]

          [[rules]]
          id = "vercel-blob-token"
          description = "Vercel Blob read/write token"
          regex = '''\bvercel_blob_(?:rw|ro)_[A-Za-z0-9_=-]{20,}\b'''
          keywords = ["vercel_blob_"]

          [[rules]]
          id = "alchemy-rpc-credential"
          description = "Alchemy credential embedded in an RPC URL"
          regex = '''https://[A-Za-z0-9.-]*g\.alchemy\.com/v2/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["alchemy.com"]

          [[rules]]
          id = "infura-rpc-credential"
          description = "Infura credential embedded in an RPC URL"
          regex = '''https://[A-Za-z0-9.-]*infura\.io/v3/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["infura.io"]

          [[rules]]
          id = "quicknode-rpc-credential"
          description = "QuickNode credential embedded in an RPC URL"
          regex = '''https://[A-Za-z0-9.-]+\.quiknode\.pro/([A-Za-z0-9_-]{16,})'''
          secretGroup = 1
          keywords = ["quiknode.pro"]

          [[rules]]
          id = "current-superfluid-saas-secret-assignment"
          description = "Literal secret assigned to a current Superfluid service variable"
          regex = '''(?i)(?:PAYLOAD_SECRET|TRIGGER_SECRET_KEY|BLOB_READ_WRITE_TOKEN|SUPERFLUID_DATA_BLOB_READ_WRITE_TOKEN|DATABASE_URL|DATABASE_URI|POSTGRES_URL|POSTGRES_PRISMA_URL|POSTGRES_URL_NON_POOLING|REDIS_URL|REDIS_TOKEN|REDIS_PASSWORD|SMTP_PASS|SMTP_PASSWORD|SIGNER_PRIVATE_KEY|RELAYER_SIGNER_PRIVATE_KEY|VERCEL_TOKEN|VERCEL_ACCESS_TOKEN|VERCEL_PROTECTION_BYPASS|SENTRY_AUTH_TOKEN|GOLDSKY_API_KEY|ALCHEMY_API_KEY|INFURA_API_KEY|COINGECKO_API_KEY|NPM_TOKEN|AWS_SECRET_ACCESS_KEY|CLOUDFLARE_API_TOKEN|OZ_RELAYER_API_KEY|SAFE_API_KEY|OZ_STORAGE_ENCRYPTION_KEY|KEYSTORE_PASSWORD|KEYSTORE_PASSPHRASE|WINDMILL_TOKEN|GRAFANA_TOKEN|LOKI_TOKEN|TEMPO_TOKEN)\s*[:=]\s*["']?([^\s"'`#]{12,})'''
          secretGroup = 1
          entropy = 2.5
          keywords = ["SECRET", "TOKEN", "PASSWORD", "PRIVATE_KEY", "DATABASE", "POSTGRES", "REDIS", "SMTP", "API_KEY"]
          TOML

      - name: Scan complete reachable history and default tip
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          gitleaks git \
            --source repo.git \
            --config gitleaks.toml \
            --report-format json \
            --report-path reports/history.raw.json \
            --redact=100 \
            --exit-code 0 \
            --log-level warn \
            --no-banner

          gitleaks dir \
            --source tip \
            --config gitleaks.toml \
            --report-format json \
            --report-path reports/default-tip.raw.json \
            --redact=100 \
            --exit-code 0 \
            --log-level warn \
            --no-banner

      - name: Produce irreversibly redacted report
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          DEFAULT_BRANCH: ${{ steps.clone.outputs.default_branch }}
          NAME: ${{ steps.clone.outputs.name }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from collections import Counter

          repo = os.environ['REPO']
          name = os.environ['NAME']
          default_branch = os.environ['DEFAULT_BRANCH']

          def load(path):
              p = Path(path)
              if not p.exists() or not p.read_text().strip():
                  return []
              return json.loads(p.read_text())

          def service(rule, match):
              s = f"{rule} {match}".upper()
              if 'PAYLOAD' in s: return 'CMS/Payload'
              if 'TRIGGER' in s: return 'Trigger.dev'
              if 'VERCEL' in s or 'BLOB_READ_WRITE_TOKEN' in s: return 'Vercel/Blob'
              if any(x in s for x in ('DATABASE_', 'POSTGRES', 'NEON')): return 'Database/Neon/Postgres'
              if 'REDIS' in s or 'UPSTASH' in s: return 'Redis/Upstash'
              if any(x in s for x in ('SMTP_', 'SENDGRID', 'MAILGUN', 'POSTMARK', 'RESEND')): return 'Email SaaS'
              if 'SIGNER_PRIVATE_KEY' in s or 'PRIVATE-KEY' in s or 'PRIVATE_KEY' in s or 'MNEMONIC' in s: return 'Signer/private key'
              if 'ALCHEMY' in s: return 'Alchemy RPC'
              if 'INFURA' in s: return 'Infura RPC'
              if 'QUICKNODE' in s: return 'QuickNode RPC'
              if 'GOLDSKY' in s: return 'Goldsky'
              if 'SENTRY' in s: return 'Sentry'
              if 'SLACK' in s: return 'Slack'
              if 'GITHUB' in s: return 'GitHub'
              if 'NPM' in s: return 'npm registry'
              if 'AWS' in s: return 'AWS'
              if 'CLOUDFLARE' in s: return 'Cloudflare'
              if 'STRIPE' in s: return 'Stripe'
              if 'WINDMILL' in s: return 'Windmill'
              if any(x in s for x in ('GRAFANA', 'LOKI', 'TEMPO', 'PROMETHEUS', 'ALERTMANAGER')): return 'Observability stack'
              if 'OZ_RELAYER' in s or 'SAFE_API_KEY' in s or 'KEYSTORE_' in s: return 'Relayer/Safe/keystore'
              if 'SUPERFLUID-PLATFORM' in s or 'SFP_' in s: return 'Superfluid Platform API'
              return 'Other provider credential'

          def known_legacy(match, file):
              if repo != 'superfluid-org/sup-eligibility-api':
                  return False
              s = f"{match} {file}".upper()
              return any(x in s for x in (
                  'ELIGIBILITY_API_KEYS', 'ELIGIBILITY_API_KEY_NAMES',
                  'ADMIN_API_KEY', 'STACK_PROGRAM_API_KEY_', 'SLACK_WEBHOOK_URL'
              ))

          def refs_containing(commit):
              if not commit:
                  return []
              p = subprocess.run([
                  'git', '-C', 'repo.git', 'for-each-ref', '--contains', commit,
                  '--format=%(refname)', 'refs/heads', 'refs/tags', 'refs/pull'
              ], text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return p.stdout.splitlines()[:100] if p.returncode == 0 else []

          def sanitize(rows, scope):
              out = []
              for row in rows:
                  match = str(row.get('Match', ''))
                  rule = str(row.get('RuleID', ''))
                  file = str(row.get('File', ''))
                  commit = str(row.get('Commit', ''))
                  item = {
                      'scope': scope,
                      'repository': repo,
                      'default_branch': default_branch,
                      'rule_id': rule,
                      'description': row.get('Description'),
                      'service': service(rule, match),
                      'file': file,
                      'start_line': row.get('StartLine'),
                      'end_line': row.get('EndLine'),
                      'commit': commit or None,
                      'commit_date': row.get('Date'),
                      'entropy': row.get('Entropy'),
                      'known_legacy_eligibility_item': known_legacy(match, file),
                  }
                  if scope == 'history':
                      item['reachable_from_refs'] = refs_containing(commit)
                  out.append(item)
              return out

          history = sanitize(load('reports/history.raw.json'), 'history')
          current = sanitize(load('reports/default-tip.raw.json'), 'default-tip')
          counts = Counter(x['service'] for x in history if not x['known_legacy_eligibility_item'])
          current_counts = Counter(x['service'] for x in current if not x['known_legacy_eligibility_item'])
          fsck = Path('fsck.txt').read_text(errors='replace') if Path('fsck.txt').exists() else ''
          unreachable = [line for line in fsck.splitlines() if re.search(r'\b(?:dangling|unreachable)\b', line)]

          report = {
              'repository': repo,
              'default_branch': default_branch,
              'history_findings': history,
              'default_tip_findings': current,
              'actionable_history_counts_by_service': dict(counts),
              'actionable_default_tip_counts_by_service': dict(current_counts),
              'known_legacy_eligibility_findings': sum(x['known_legacy_eligibility_item'] for x in history),
              'fsck_dangling_or_unreachable_lines': unreachable[:100],
              'redaction': 'Secret and Match fields were deleted after Gitleaks 100% redaction. No credential value is present.',
          }
          Path(f'{name}.safe.json').write_text(json.dumps(report, indent=2))
          PY

          rm -f reports/*.raw.json

      - name: Upload redacted repository report
        uses: actions/upload-artifact@v4
        with:
          name: sf-secret-scan-${{ steps.clone.outputs.name }}
          path: ${{ steps.clone.outputs.name }}.safe.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

  aggregate:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all redacted reports
        uses: actions/download-artifact@v4
        with:
          pattern: sf-secret-scan-*
          path: reports
          merge-multiple: true

      - name: Aggregate service and repository results
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter, defaultdict

          reports = [json.loads(p.read_text()) for p in sorted(Path('reports').glob('*.safe.json'))]
          history = []
          current = []
          legacy = 0
          fsck = {}
          for report in reports:
              history.extend(x for x in report['history_findings'] if not x['known_legacy_eligibility_item'])
              current.extend(x for x in report['default_tip_findings'] if not x['known_legacy_eligibility_item'])
              legacy += report['known_legacy_eligibility_findings']
              if report['fsck_dangling_or_unreachable_lines']:
                  fsck[report['repository']] = report['fsck_dangling_or_unreachable_lines']

          by_service_history = Counter(x['service'] for x in history)
          by_service_current = Counter(x['service'] for x in current)
          by_repo_history = Counter(x['repository'] for x in history)
          by_repo_current = Counter(x['repository'] for x in current)
          rules = Counter(x['rule_id'] for x in history)

          aggregate = {
              'repositories_expected': 48,
              'repositories_reported': len(reports),
              'history_findings_excluding_known_legacy_eligibility_items': len(history),
              'default_tip_findings_excluding_known_legacy_eligibility_items': len(current),
              'known_legacy_eligibility_findings_separated': legacy,
              'history_counts_by_service': dict(by_service_history),
              'default_tip_counts_by_service': dict(by_service_current),
              'history_counts_by_repository': dict(by_repo_history),
              'default_tip_counts_by_repository': dict(by_repo_current),
              'history_counts_by_rule': dict(rules),
              'fsck_dangling_or_unreachable': fsck,
              'history_findings': history,
              'default_tip_findings': current,
              'method': {
                  'scanner': 'Gitleaks 8.30.1 default rules plus Superfluid current-service rules',
                  'history': 'all commits reachable from mirrored branches, tags, GitHub PR head/merge refs, and notes',
                  'current': 'separate scan of each repository default-branch tip',
                  'redaction': '100% scanner redaction followed by deletion of Secret and Match fields',
                  'credential_testing': 'none',
              },
          }
          Path('superfluid-org-secret-history-scan.json').write_text(json.dumps(aggregate, indent=2))
          Path('superfluid-org-secret-history-scan-summary.txt').write_text(
              f"Repositories reported: {len(reports)}/48\n"
              f"History findings, legacy eligibility excluded: {len(history)}\n"
              f"Default-tip findings, legacy eligibility excluded: {len(current)}\n"
              f"Known legacy eligibility findings separated: {legacy}\n"
              f"History by service: {dict(by_service_history)}\n"
              f"Current by service: {dict(by_service_current)}\n"
          )
          PY

      - name: Upload combined redacted audit
        uses: actions/upload-artifact@v4
        with:
          name: superfluid-org-secret-history-scan
          path: |
            superfluid-org-secret-history-scan.json
            superfluid-org-secret-history-scan-summary.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
