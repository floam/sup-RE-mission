name: Migrate reconstructed writes

on:
  push:
    branches:
      - feat-clear-macro-write-executor

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[clear-macro-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-clear-macro-write-executor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research/claim-app-sources/reconstructed/package-lock.json
      - name: Migrate write hooks
        run: node scripts/migrate-reconstructed-write-hooks.mjs
      - name: Install dependencies
        working-directory: research/claim-app-sources/reconstructed
        run: npm ci
      - name: Typecheck
        working-directory: research/claim-app-sources/reconstructed
        run: npm run typecheck
      - name: Unit tests
        working-directory: research/claim-app-sources/reconstructed
        run: npm test
      - name: Production build
        working-directory: research/claim-app-sources/reconstructed
        run: npm run build
      - name: Commit migration
        run: |
          rm scripts/migrate-reconstructed-write-hooks.mjs
          rm .github/workflows/migrate-reconstructed-write-hooks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate reconstructed writes to shared executor [clear-macro-migration]"
          git push origin HEAD:feat-clear-macro-write-executor
