name: Compare live claim deployments

on:
  push:
    paths:
      - ".github/workflows/recover-claim-preview-sources.yml"
  pull_request:
    paths:
      - ".github/workflows/recover-claim-preview-sources.yml"
      - "audit/claim-preview-comparison-trigger-branch.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Capture production and preview claim deployments
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify pinned production snapshot
        run: npm run verify:claim-snapshot

      - name: Recover both live deployments
        id: recover
        shell: bash
        run: |
          set +e
          production_root="${RUNNER_TEMP}/claim-production-live-recovery"
          preview_root="${RUNNER_TEMP}/claim-preview-live-recovery"
          mkdir -p "${production_root}" "${preview_root}"

          npm run recover:claim-sources -- \
            --origin https://claim.superfluid.org \
            --out "${production_root}" \
            2>&1 | tee "${RUNNER_TEMP}/claim-production-live-recovery.log"
          production_status=${PIPESTATUS[0]}
          cp "${RUNNER_TEMP}/claim-production-live-recovery.log" "${production_root}/recovery.log"

          npm run recover:claim-sources -- \
            --origin https://claim.preview.superfluid.finance \
            --out "${preview_root}" \
            2>&1 | tee "${RUNNER_TEMP}/claim-preview-live-recovery.log"
          preview_status=${PIPESTATUS[0]}
          cp "${RUNNER_TEMP}/claim-preview-live-recovery.log" "${preview_root}/recovery.log"

          echo "production_status=${production_status}" >> "$GITHUB_OUTPUT"
          echo "preview_status=${preview_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compare each deployment with pinned snapshot
        if: always()
        shell: bash
        run: |
          for name in production preview; do
            root="${RUNNER_TEMP}/claim-${name}-live-recovery"
            if [[ -f "${root}/manifest.json" ]]; then
              node tools/claim-source-recovery/verify-snapshot.mjs \
                --live-manifest "${root}/manifest.json" \
                --report "${root}/snapshot-diff.json"
            fi
          done

      - name: Package live pair
        if: always()
        run: |
          cd "${RUNNER_TEMP}"
          zip -qr "${GITHUB_WORKSPACE}/claim-live-pair-recovery.zip" \
            claim-production-live-recovery claim-preview-live-recovery

      - name: Upload live pair
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claim-live-pair-recovery
          path: claim-live-pair-recovery.zip
          if-no-files-found: error
          retention-days: 7

      - name: Fail when recovery failed
        if: steps.recover.outputs.production_status != '0' || steps.recover.outputs.preview_status != '0'
        run: exit 1
