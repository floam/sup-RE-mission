name: Scan all Superfluid org refs for service credentials v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/superfluid-org-secret-history-scan-v3.yml

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: list
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t repos < <(gh api --paginate 'orgs/superfluid-org/repos?type=public&per_page=100' --jq '.[].full_name' | sort -u)
          printf 'repos=%s\n' "$(printf '%s\n' "${repos[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "${#repos[@]}" >> "$GITHUB_OUTPUT"

  scan:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.enumerate.outputs.repos) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Mirror repository and fetch exposed refs
        id: clone
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -Eeuo pipefail
          name="${REPO#*/}"
          default_branch="$(gh api "repos/${REPO}" --jq .default_branch)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

          git clone --mirror "https://github.com/${REPO}.git" repo.git
          git -C repo.git fetch origin \
            '+refs/pull/*/head:refs/pull/*/head' \
            '+refs/pull/*/merge:refs/pull/*/merge' \
            '+refs/notes/*:refs/notes/*' \
            --force || true

          git -C repo.git fsck --full --no-reflogs > fsck.txt 2>&1 || true
          git -C repo.git for-each-ref --format='%(refname) %(objectname)' \
            refs/heads refs/tags refs/pull refs/notes | sort > refs.txt
          git -C repo.git rev-list --all --count > reachable-commit-count.txt
          git -C repo.git count-objects -vH > object-counts.txt

      - name: Write provider-aware configuration
        shell: bash
        run: |
          cat > gitleaks.toml <<'TOML'
          [extend]
          useDefault = true

          [[rules]]
          id = "superfluid-platform-api-key"
          description = "Superfluid Platform API key"
          regex = '''\bsfp_[A-Za-z0-9_-]{24,}\b'''
          keywords = ["sfp_"]

          [[rules]]
          id = "trigger-dev-key"
          description = "Trigger.dev secret or access key"
          regex = '''\btr_(?:dev|prod|pat|test)_[A-Za-z0-9_-]{16,}\b'''
          keywords = ["tr_dev_", "tr_prod_", "tr_pat_", "tr_test_"]

          [[rules]]
          id = "vercel-blob-token"
          description = "Vercel Blob token"
          regex = '''\bvercel_blob_(?:rw|ro)_[A-Za-z0-9_=-]{16,}\b'''
          keywords = ["vercel_blob_"]

          [[rules]]
          id = "alchemy-rpc-key"
          description = "Alchemy key embedded in RPC URL"
          regex = '''https://[A-Za-z0-9.-]*g\.alchemy\.com/v2/([A-Za-z0-9_-]{12,})'''
          secretGroup = 1
          keywords = ["alchemy.com"]

          [[rules]]
          id = "infura-rpc-key"
          description = "Infura project ID embedded in RPC URL"
          regex = '''https://[A-Za-z0-9.-]*infura\.io/v3/([A-Za-z0-9_-]{12,})'''
          secretGroup = 1
          keywords = ["infura.io"]

          [[rules]]
          id = "quicknode-rpc-key"
          description = "QuickNode credential embedded in RPC URL"
          regex = '''https://[A-Za-z0-9.-]+\.quiknode\.pro/([A-Za-z0-9_-]{12,})'''
          secretGroup = 1
          keywords = ["quiknode.pro"]

          [[rules]]
          id = "credentialed-service-url"
          description = "Service URL containing username and password"
          regex = '''(?i)\b(?:postgres(?:ql)?|redis(?:s)?|mongodb(?:\+srv)?|https?)://[^\s:/@]+:([^\s/@]{6,})@[A-Za-z0-9._~%+:-]+'''
          secretGroup = 1
          keywords = ["://"]

          [[rules]]
          id = "cms-payload-secret-assignment"
          description = "CMS/Payload secret assignment"
          regex = '''(?i)PAYLOAD_SECRET\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["PAYLOAD_SECRET"]

          [[rules]]
          id = "trigger-secret-assignment"
          description = "Trigger.dev secret assignment"
          regex = '''(?i)TRIGGER_(?:SECRET_KEY|ACCESS_TOKEN|PROJECT_REF)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["TRIGGER_"]

          [[rules]]
          id = "vercel-secret-assignment"
          description = "Vercel or Blob secret assignment"
          regex = '''(?i)(?:BLOB_READ_WRITE_TOKEN|SUPERFLUID_DATA_BLOB_READ_WRITE_TOKEN|VERCEL_TOKEN|VERCEL_ACCESS_TOKEN|VERCEL_PROTECTION_BYPASS)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["VERCEL_", "BLOB_READ_WRITE_TOKEN"]

          [[rules]]
          id = "database-secret-assignment"
          description = "Database/Neon/Postgres credential assignment"
          regex = '''(?i)(?:DATABASE_URL|DATABASE_URI|POSTGRES_URL|POSTGRES_PRISMA_URL|POSTGRES_URL_NON_POOLING|NEON_DATABASE_URL)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["DATABASE_", "POSTGRES_", "NEON_"]

          [[rules]]
          id = "redis-secret-assignment"
          description = "Redis/Upstash credential assignment"
          regex = '''(?i)(?:REDIS_URL|REDIS_TOKEN|REDIS_PASSWORD|UPSTASH_REDIS_REST_TOKEN|UPSTASH_REDIS_REST_URL)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["REDIS_", "UPSTASH_"]

          [[rules]]
          id = "email-secret-assignment"
          description = "Email SaaS credential assignment"
          regex = '''(?i)(?:SMTP_PASS|SMTP_PASSWORD|SENDGRID_API_KEY|MAILGUN_API_KEY|POSTMARK_SERVER_TOKEN|RESEND_API_KEY)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["SMTP_", "SENDGRID_", "MAILGUN_", "POSTMARK_", "RESEND_"]

          [[rules]]
          id = "signer-private-key-assignment"
          description = "Signer, relayer, deployer, mnemonic, or keystore secret"
          regex = '''(?i)(?:SIGNER_PRIVATE_KEY|RELAYER_SIGNER_PRIVATE_KEY|DEPLOYER_PRIVATE_KEY|PRIVATE_KEY|MNEMONIC|SEED_PHRASE|OZ_RELAYER_API_KEY|SAFE_API_KEY|OZ_STORAGE_ENCRYPTION_KEY|KEYSTORE_PASSWORD|KEYSTORE_PASSPHRASE)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["PRIVATE_KEY", "MNEMONIC", "SEED_PHRASE", "RELAYER_", "KEYSTORE_"]

          [[rules]]
          id = "rpc-indexer-secret-assignment"
          description = "RPC, indexer, or market-data credential assignment"
          regex = '''(?i)(?:ALCHEMY_API_KEY|INFURA_API_KEY|QUICKNODE_API_KEY|GOLDSKY_API_KEY|THE_GRAPH_API_KEY|COINGECKO_API_KEY)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["ALCHEMY_", "INFURA_", "QUICKNODE_", "GOLDSKY_", "THE_GRAPH_", "COINGECKO_"]

          [[rules]]
          id = "cloud-ci-secret-assignment"
          description = "Cloud, CI, registry, or monitoring credential assignment"
          regex = '''(?i)(?:AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|CLOUDFLARE_API_TOKEN|NPM_TOKEN|GITHUB_TOKEN|GH_TOKEN|SENTRY_AUTH_TOKEN)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["AWS_", "CLOUDFLARE_", "NPM_TOKEN", "GITHUB_TOKEN", "GH_TOKEN", "SENTRY_"]

          [[rules]]
          id = "internal-saas-secret-assignment"
          description = "Windmill or observability credential assignment"
          regex = '''(?i)(?:WINDMILL_TOKEN|GRAFANA_TOKEN|LOKI_TOKEN|TEMPO_TOKEN|PROMETHEUS_TOKEN|ALERTMANAGER_TOKEN)\s*[:=]\s*["']?([^\s"'`#]{10,})'''
          secretGroup = 1
          keywords = ["WINDMILL_", "GRAFANA_", "LOKI_", "TEMPO_", "PROMETHEUS_", "ALERTMANAGER_"]
          TOML

      - name: Scan every fetched branch tag and PR ref
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          gitleaks git repo.git \
            --log-opts="--all" \
            --config gitleaks.toml \
            --report-format json \
            --report-path reports/raw.json \
            --exit-code 0 \
            --log-level error \
            --no-banner

      - name: Build safe fingerprinted report and erase raw findings
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          NAME: ${{ steps.clone.outputs.name }}
          DEFAULT_BRANCH: ${{ steps.clone.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from collections import Counter
          from pathlib import Path

          repo = os.environ['REPO']
          name = os.environ['NAME']
          default = os.environ['DEFAULT_BRANCH']
          raw_path = Path('reports/raw.json')
          rows = json.loads(raw_path.read_text()) if raw_path.exists() and raw_path.read_text().strip() else []

          placeholder_terms = (
              'your-', 'your_', 'your ', 'example', 'placeholder', 'changeme', 'change_me',
              'dummy', 'sample', 'redacted', 'replace', 'insert', 'process.env', 'import.meta.env',
              '${', '{{', 'secrets.', '<secret', '<token', '<key', 'not-production', 'not_production'
          )

          def shape(secret):
              if re.fullmatch(r'0x[0-9a-fA-F]+', secret): return f'0x-hex/{len(secret)-2}'
              if re.fullmatch(r'[0-9a-fA-F]+', secret): return f'hex/{len(secret)}'
              if re.fullmatch(r'[A-Za-z0-9_-]+', secret): return f'base64url-like/{len(secret)}'
              if '://' in secret: return f'url/{len(secret)}'
              if ' ' in secret: return f'words/{len(secret.split())}'
              return f'mixed/{len(secret)}'

          def context(path):
              p = path.lower()
              if any(x in p for x in ('node_modules/', '/vendor/', '/lib/forge-std', '/lib/openzeppelin')): return 'vendored'
              if any(x in p for x in ('test', 'fixture', 'mock', 'example', 'sample', 'demo', 'hardhat', 'anvil', 'foundry')): return 'test/example'
              if any(x in p for x in ('readme', 'docs/', 'documentation')): return 'documentation'
              if any(x in p for x in ('.github/workflows', 'docker-compose', 'compose.', 'k8s/', 'helm/', 'terraform', 'vercel.json')): return 'deployment/config'
              if '.env' in p or p.endswith(('.yaml','.yml','.toml','.ini','.conf','.json')): return 'configuration'
              return 'source'

          def service(rule):
              r = rule.lower()
              groups = [
                  (('payload',), 'CMS/Payload'), (('trigger',), 'Trigger.dev'),
                  (('vercel', 'blob-token'), 'Vercel/Blob'),
                  (('database', 'postgres', 'neon', 'credentialed-service-url'), 'Database/credentialed service'),
                  (('redis', 'upstash'), 'Redis/Upstash'),
                  (('email-', 'sendgrid', 'mailgun', 'postmark', 'resend', 'smtp'), 'Email SaaS'),
                  (('signer', 'private-key', 'private_key', 'mnemonic', 'keystore', 'relayer'), 'Signer/relayer/private key'),
                  (('alchemy',), 'Alchemy RPC'), (('infura',), 'Infura RPC'), (('quicknode',), 'QuickNode RPC'),
                  (('rpc-indexer', 'goldsky', 'the-graph', 'coingecko'), 'Indexer/market-data SaaS'),
                  (('github',), 'GitHub'), (('npm',), 'npm registry'), (('aws',), 'AWS'),
                  (('cloudflare',), 'Cloudflare'), (('sentry',), 'Sentry'), (('stripe',), 'Stripe'),
                  (('windmill', 'grafana', 'loki', 'tempo', 'prometheus', 'alertmanager', 'internal-saas'), 'Internal SaaS/observability'),
                  (('superfluid-platform',), 'Superfluid Platform API'),
              ]
              for needles, label in groups:
                  if any(n in r for n in needles): return label
              return 'Other high-confidence detector'

          def refs_containing(commit):
              if not commit: return []
              p = subprocess.run([
                  'git','-C','repo.git','for-each-ref','--contains',commit,
                  '--format=%(refname)','refs/heads','refs/tags','refs/pull','refs/notes'
              ], text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return p.stdout.splitlines()[:100] if p.returncode == 0 else []

          def tip_contains(secret, refs):
              if not secret or '\n' in secret or '\r' in secret or len(secret) > 8192 or not refs: return []
              p = subprocess.run(['git','-C','repo.git','grep','-F','-l','-e',secret,'--',*refs],
                                 text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return p.stdout.splitlines()[:40] if p.returncode == 0 else []

          all_refs = Path('refs.txt').read_text().splitlines()
          ref_names = [line.split(' ',1)[0] for line in all_refs]
          default_ref = f'refs/heads/{default}'
          findings = []
          for row in rows:
              secret = str(row.get('Secret') or '')
              rule = str(row.get('RuleID') or '')
              path = str(row.get('File') or '')
              commit = str(row.get('Commit') or '')
              low = secret.lower()
              likely_placeholder = (not secret or any(term in low for term in placeholder_terms) or
                                    bool(re.fullmatch(r'[xX*._-]{4,}', secret)))
              default_locs = tip_contains(secret, [default_ref])
              ref_locs = tip_contains(secret, ref_names)
              findings.append({
                  'repository': repo,
                  'rule_id': rule,
                  'description': row.get('Description'),
                  'service': service(rule),
                  'file': path,
                  'context': context(path),
                  'start_line': row.get('StartLine'),
                  'end_line': row.get('EndLine'),
                  'commit': commit or None,
                  'commit_date': row.get('Date'),
                  'entropy': row.get('Entropy'),
                  'secret_sha256': hashlib.sha256(secret.encode()).hexdigest() if secret else None,
                  'secret_length': len(secret),
                  'secret_shape': shape(secret),
                  'likely_placeholder': likely_placeholder,
                  'reachable_from_refs': refs_containing(commit),
                  'present_on_default_tip': bool(default_locs),
                  'default_tip_locations': default_locs,
                  'present_on_any_ref_tip': bool(ref_locs),
                  'ref_tip_locations': ref_locs,
              })

          fsck = Path('fsck.txt').read_text(errors='replace').splitlines()
          dangling = [line for line in fsck if re.search(r'\b(?:dangling|unreachable)\b', line)]
          report = {
              'repository': repo,
              'default_branch': default,
              'reachable_commit_count': int(Path('reachable-commit-count.txt').read_text().strip()),
              'refs': len(all_refs),
              'scan_command': 'gitleaks git repo.git --log-opts=--all',
              'findings': findings,
              'counts_by_service': dict(Counter(x['service'] for x in findings)),
              'fsck_dangling_or_unreachable': dangling[:100],
              'redaction': 'Only SHA-256 fingerprints, lengths, shapes, metadata, and paths remain. Raw Secret/Match/line content was deleted before upload.',
          }
          Path(f'{name}.safe.json').write_text(json.dumps(report, indent=2))
          raw_path.unlink(missing_ok=True)
          PY
          test ! -e reports/raw.json

      - name: Upload safe repository report
        uses: actions/upload-artifact@v4
        with:
          name: sf-all-refs-secret-scan-${{ steps.clone.outputs.name }}
          path: ${{ steps.clone.outputs.name }}.safe.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

  aggregate:
    needs: [enumerate, scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sf-all-refs-secret-scan-*
          path: reports
          merge-multiple: true

      - name: Aggregate safe reports
        shell: bash
        env:
          EXPECTED: ${{ needs.enumerate.outputs.count }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          reports = [json.loads(p.read_text()) for p in sorted(Path('reports').glob('*.safe.json'))]
          findings = [x for r in reports for x in r['findings']]
          fp_repos = defaultdict(set)
          for x in findings:
              if x.get('secret_sha256'): fp_repos[x['secret_sha256']].add(x['repository'])
          for x in findings:
              repos = sorted(fp_repos.get(x.get('secret_sha256'), set()))
              x['same_value_repositories'] = repos
              x['cross_repository_reuse'] = len(repos) > 1

          result = {
              'repositories_expected': int(os.environ.get('EXPECTED') or 0),
              'repositories_reported': len(reports),
              'reachable_commits_total': sum(r['reachable_commit_count'] for r in reports),
              'refs_total': sum(r['refs'] for r in reports),
              'finding_count': len(findings),
              'nonplaceholder_finding_count': sum(not x['likely_placeholder'] for x in findings),
              'present_on_default_tip_count': sum(x['present_on_default_tip'] for x in findings),
              'present_on_any_ref_tip_count': sum(x['present_on_any_ref_tip'] for x in findings),
              'counts_by_service': dict(Counter(x['service'] for x in findings)),
              'counts_by_rule': dict(Counter(x['rule_id'] for x in findings)),
              'counts_by_repository': dict(Counter(x['repository'] for x in findings)),
              'fsck_dangling_or_unreachable': {r['repository']: r['fsck_dangling_or_unreachable'] for r in reports if r['fsck_dangling_or_unreachable']},
              'findings': findings,
              'method': {
                  'scanner': 'Verified Gitleaks 8.30.1 default rules plus Superfluid current-service rules',
                  'history_scope': 'git log -p --all over mirror clones after fetching branches, tags, PR head/merge refs, and notes',
                  'scan_command': 'gitleaks git repo.git --log-opts=--all',
                  'credential_testing': 'None',
                  'redaction': 'Raw values were converted to SHA-256 fingerprints and deleted before artifact upload.',
              }
          }
          Path('superfluid-org-all-refs-secret-scan.json').write_text(json.dumps(result, indent=2))
          Path('summary.txt').write_text(
              f"Repositories: {len(reports)}/{result['repositories_expected']}\n"
              f"Reachable commits summed by repository: {result['reachable_commits_total']}\n"
              f"Fetched refs: {result['refs_total']}\n"
              f"Findings: {len(findings)}\n"
              f"Non-placeholder findings: {result['nonplaceholder_finding_count']}\n"
              f"Present on default tips: {result['present_on_default_tip_count']}\n"
              f"Present on any ref tips: {result['present_on_any_ref_tip_count']}\n"
              f"By service: {result['counts_by_service']}\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: superfluid-org-all-refs-secret-scan-v3
          path: |
            superfluid-org-all-refs-secret-scan.json
            summary.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
