name: Direct Alchemy RPC benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/secure-alchemy-rpc-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALCHEMY_API_KEY: xn7PYKk2hrDMxsCtaYPcn
    steps:
      - uses: actions/checkout@v4

      - name: Benchmark Alchemy and Superfluid RPCs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rpc-benchmark
          node <<'NODE'
          const fs = require('node:fs');
          const { performance } = require('node:perf_hooks');

          const key = process.env.ALCHEMY_API_KEY;
          if (!key) throw new Error('Missing API key');
          const redact = value => String(value ?? '').split(key).join('[REDACTED]');
          const percentile = (values, p) => {
            if (!values.length) return null;
            const a = [...values].sort((x, y) => x - y);
            return a[Math.min(a.length - 1, Math.ceil((p / 100) * a.length) - 1)];
          };
          const hexInt = value => typeof value === 'string' && /^0x[0-9a-f]+$/i.test(value) ? Number.parseInt(value, 16) : null;
          const selectedHeaders = headers => {
            const out = {};
            for (const [name, value] of headers.entries()) {
              if (/^(server|via|content-type|access-control-|cache-control|cf-|x-alchemy|x-ratelimit|x-request|x-amz|alt-svc)/i.test(name)) out[name] = redact(value);
            }
            return out;
          };

          async function request(url, init = {}, timeout = 15000) {
            const started = performance.now();
            try {
              const response = await fetch(url, { ...init, signal: AbortSignal.timeout(timeout) });
              const text = redact(await response.text());
              let json = null;
              try { json = JSON.parse(text); } catch {}
              return {
                ok: response.ok,
                status: response.status,
                latencyMs: +(performance.now() - started).toFixed(1),
                headers: selectedHeaders(response.headers),
                json,
                body: text.slice(0, 1200),
              };
            } catch (error) {
              return { ok: false, error: redact(error?.stack || error), latencyMs: +(performance.now() - started).toFixed(1) };
            }
          }

          const rpc = (url, method, params = [], id = 1, extraHeaders = {}) => request(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json', accept: 'application/json', ...extraHeaders },
            body: JSON.stringify({ jsonrpc: '2.0', id, method, params }),
          });
          const result = response => response?.json?.result ?? null;
          const error = response => response?.json?.error ?? response?.error ?? (!response?.ok ? response?.body : null);

          const networks = [
            ['ethereum-mainnet', '0x1', `https://eth-mainnet.g.alchemy.com/v2/${key}`, 'https://rpc-endpoints.superfluid.dev/eth-mainnet', 'https://eth-mainnet.arpc.x.superfluid.dev'],
            ['base-mainnet', '0x2105', `https://base-mainnet.g.alchemy.com/v2/${key}`, 'https://rpc-endpoints.superfluid.dev/base-mainnet', 'https://base-mainnet.arpc.x.superfluid.dev'],
            ['arbitrum-one', '0xa4b1', `https://arb-mainnet.g.alchemy.com/v2/${key}`, 'https://rpc-endpoints.superfluid.dev/arbitrum-one', 'https://arbitrum-one.arpc.x.superfluid.dev'],
            ['optimism-mainnet', '0xa', `https://opt-mainnet.g.alchemy.com/v2/${key}`, 'https://rpc-endpoints.superfluid.dev/optimism-mainnet', 'https://optimism-mainnet.arpc.x.superfluid.dev'],
            ['polygon-mainnet', '0x89', `https://polygon-mainnet.g.alchemy.com/v2/${key}`, 'https://rpc-endpoints.superfluid.dev/polygon-mainnet', 'https://polygon-mainnet.arpc.x.superfluid.dev'],
          ];

          async function benchmarkEvm(url) {
            const initial = await Promise.all([
              rpc(url, 'eth_chainId'),
              rpc(url, 'eth_blockNumber'),
              rpc(url, 'web3_clientVersion'),
              rpc(url, 'eth_getBalance', ['0x0000000000000000000000000000000000000000', '0x1000000']),
              rpc(url, 'definitely_not_a_real_method'),
              rpc(url, 'eth_chainId', [], 6, { origin: 'https://example.test' }),
              request(url, {
                method: 'OPTIONS',
                headers: {
                  origin: 'https://example.test',
                  'access-control-request-method': 'POST',
                  'access-control-request-headers': 'content-type',
                },
              }),
            ]);
            const [chain, block, client, archive, invalid, corsPost, preflight] = initial;

            const sequential = [];
            for (let i = 0; i < 7; i++) sequential.push(await rpc(url, 'eth_chainId', [], 20 + i));
            const concurrent = await Promise.all(Array.from({ length: 12 }, (_, i) => rpc(url, 'eth_chainId', [], 100 + i)));
            const batch = await request(url, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify([
                { jsonrpc: '2.0', id: 201, method: 'eth_chainId', params: [] },
                { jsonrpc: '2.0', id: 202, method: 'eth_blockNumber', params: [] },
                { jsonrpc: '2.0', id: 203, method: 'web3_clientVersion', params: [] },
              ]),
            });
            const seq = sequential.filter(x => x.ok && result(x) != null).map(x => x.latencyMs);
            const conc = concurrent.filter(x => x.ok && result(x) != null).map(x => x.latencyMs);
            return {
              status: chain.status ?? null,
              chainId: result(chain),
              chainError: error(chain),
              blockHeight: hexInt(result(block)),
              blockError: error(block),
              clientVersion: result(client),
              clientError: error(client),
              archive: error(archive) ? { error: error(archive) } : { result: result(archive) },
              invalidMethodError: error(invalid),
              headers: chain.headers,
              sequential: { successes: seq.length, medianMs: percentile(seq, 50), p95Ms: percentile(seq, 95), valuesMs: seq },
              concurrent12: { successes: conc.length, medianMs: percentile(conc, 50), p95Ms: percentile(conc, 95), valuesMs: conc },
              batch: { status: batch.status, latencyMs: batch.latencyMs, count: Array.isArray(batch.json) ? batch.json.length : null, error: error(batch) },
              cors: {
                postStatus: corsPost.status,
                postAllowOrigin: corsPost.headers?.['access-control-allow-origin'] ?? null,
                postAllowCredentials: corsPost.headers?.['access-control-allow-credentials'] ?? null,
                preflightStatus: preflight.status,
                preflightAllowOrigin: preflight.headers?.['access-control-allow-origin'] ?? null,
                preflightAllowMethods: preflight.headers?.['access-control-allow-methods'] ?? null,
              },
            };
          }

          async function benchmarkSolana(url) {
            const methods = {};
            for (const method of ['getHealth', 'getVersion', 'getSlot', 'getLatestBlockhash']) methods[method] = await rpc(url, method);
            const runs = [];
            for (let i = 0; i < 9; i++) runs.push(await rpc(url, 'getHealth', [], 500 + i));
            const concurrent = await Promise.all(Array.from({ length: 12 }, (_, i) => rpc(url, 'getHealth', [], 600 + i)));
            const seq = runs.filter(x => x.ok && result(x) != null).map(x => x.latencyMs);
            const conc = concurrent.filter(x => x.ok && result(x) != null).map(x => x.latencyMs);
            const batch = await request(url, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify([
                { jsonrpc: '2.0', id: 701, method: 'getHealth' },
                { jsonrpc: '2.0', id: 702, method: 'getVersion' },
                { jsonrpc: '2.0', id: 703, method: 'getSlot' },
              ]),
            });
            return {
              methods: Object.fromEntries(Object.entries(methods).map(([name, response]) => [name, { status: response.status, result: result(response), error: error(response), latencyMs: response.latencyMs, headers: response.headers }])),
              sequential: { successes: seq.length, medianMs: percentile(seq, 50), p95Ms: percentile(seq, 95), valuesMs: seq },
              concurrent12: { successes: conc.length, medianMs: percentile(conc, 50), p95Ms: percentile(conc, 95), valuesMs: conc },
              batch: { status: batch.status, latencyMs: batch.latencyMs, count: Array.isArray(batch.json) ? batch.json.length : null, error: error(batch) },
            };
          }

          async function main() {
            const output = { capturedAt: new Date().toISOString(), runner: process.env.RUNNER_NAME, networks: {}, solana: null };
            for (const [name, expectedChainId, alchemy, legacy, x] of networks) {
              const urls = { alchemy, superfluidLegacy: legacy, superfluidX: x };
              const network = { expectedChainId, endpoints: {}, freshness: [] };
              for (const [label, url] of Object.entries(urls)) network.endpoints[label] = await benchmarkEvm(url);
              for (let round = 0; round < 5; round++) {
                const labels = Object.keys(urls);
                const responses = await Promise.all(labels.map((label, index) => rpc(urls[label], 'eth_blockNumber', [], 800 + round * 10 + index)));
                const heights = Object.fromEntries(labels.map((label, index) => [label, hexInt(result(responses[index]))]));
                const valid = Object.values(heights).filter(Number.isFinite);
                network.freshness.push({ heights, spread: valid.length > 1 ? Math.max(...valid) - Math.min(...valid) : null });
              }
              output.networks[name] = network;
            }
            output.solana = await benchmarkSolana(`https://solana-mainnet.g.alchemy.com/v2/${key}`);

            fs.writeFileSync('rpc-benchmark/results.json', JSON.stringify(output, null, 2));
            const lines = ['# Alchemy vs Superfluid RPC benchmark', '', `Captured: ${output.capturedAt}`, `Runner: ${output.runner}`, ''];
            for (const [name, network] of Object.entries(output.networks)) {
              lines.push(`## ${name}`, '');
              for (const [label, endpoint] of Object.entries(network.endpoints)) {
                lines.push(`- ${label}: chain=${endpoint.chainId ?? JSON.stringify(endpoint.chainError)}, block=${endpoint.blockHeight ?? JSON.stringify(endpoint.blockError)}, median=${endpoint.sequential.medianMs}ms, p95=${endpoint.sequential.p95Ms}ms, concurrency=${endpoint.concurrent12.successes}/12, batch=${endpoint.batch.count ?? JSON.stringify(endpoint.batch.error)}, archive=${endpoint.archive.error ? JSON.stringify(endpoint.archive.error) : 'ok'}`);
              }
              const spreads = network.freshness.map(x => x.spread).filter(Number.isFinite);
              lines.push(`- freshness spread: median=${percentile(spreads, 50)} blocks, max=${spreads.length ? Math.max(...spreads) : 'n/a'} blocks`, '');
            }
            lines.push('## solana-mainnet Alchemy', '');
            lines.push(`- health=${JSON.stringify(output.solana.methods.getHealth.result ?? output.solana.methods.getHealth.error)}`);
            lines.push(`- version=${JSON.stringify(output.solana.methods.getVersion.result ?? output.solana.methods.getVersion.error)}`);
            lines.push(`- median=${output.solana.sequential.medianMs}ms, p95=${output.solana.sequential.p95Ms}ms, concurrency=${output.solana.concurrent12.successes}/12, batch=${output.solana.batch.count ?? JSON.stringify(output.solana.batch.error)}`, '');
            fs.writeFileSync('rpc-benchmark/summary.md', `${lines.join('\n')}\n`);
            console.log(lines.join('\n'));
          }

          main().catch(error => {
            console.error(redact(error?.stack || error));
            process.exit(1);
          });
          NODE

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-vs-superfluid-rpc-benchmark
          path: rpc-benchmark
          if-no-files-found: error
          retention-days: 3
