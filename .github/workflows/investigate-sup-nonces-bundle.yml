name: Build SUP nonce investigation bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "investigate-sup-nonces-*"

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle for JavaScriptCore / a-Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle investigate-sup-nonces for JavaScriptCore
        run: >-
          npx esbuild sdk/package/scripts/investigate-sup-nonces.js
          --bundle
          --platform=browser
          --target=es2020
          --outfile=investigate-sup-nonces.bundle.js

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: investigate-sup-nonces-javascriptcore
          path: investigate-sup-nonces.bundle.js
          if-no-files-found: error

      - name: Attach bundle to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: investigate-sup-nonces.bundle.js
