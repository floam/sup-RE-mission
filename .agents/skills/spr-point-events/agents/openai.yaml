display_name: spr-point-events
short_description: Fetch, export, group, and analyze Superfluid Points Rewards point events globally or per account, with campaign/date filters and event-name normalization such as grouping eventName-0xabc123 hash suffixes by prefix. Use for CMS /points/events, /points/event-balance, point-event names, date windows, account history, and event prefix reports.
default_prompt: Use this skill for spr-point-events workflows.
